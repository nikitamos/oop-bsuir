[workspace]
resolver = "3"
members = [
    "clients",
    "controllers",
    "models",
    "api",
    "shared", "fintracker",
]

[workspace.dependencies]
rust_decimal = { version = "1.40.0", features = ["serde-arbitrary-precision"] }
utoipa = { version = "5.4.0", features = ["decimal"] }
serde_json = { version = "1.0.149", features = ["arbitrary_precision"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
axum = "0.8.8"
chrono = "0.4.44"
log = "0.4.29"
tokio = { version = "1.49.0", features = ["fs", "rt-multi-thread"] }
async-trait = "0.1.89"
rstest = "0.26.1"
